<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#172319">
    <meta name="description" content="Steppe World — Монголын тал нутгаас сэдэвлэсэн нэг нийтийн блок ертөнц.">
    <title>Steppe World</title>
    <link rel="stylesheet" href="/client/styles.css">
    <link rel="stylesheet" href="/client/mobile.css">
    <script defer src="https://usions.com/sdk/v2/2.27.0/usion-sdk.js"></script>
  </head>
  <body>
    <main id="game">
      <canvas id="game-canvas" aria-label="Steppe World shared block world"></canvas>

      <section id="join-screen" class="join-screen">
        <div class="join-card">
          <div class="brand-blocks" aria-hidden="true"><i></i><i></i><i></i></div>
          <p class="eyebrow">MONGOLIA · ONE PERSISTENT WORLD</p>
          <h1>STEPPE<br><span>WORLD</span></h1>
          <p class="tagline">Уудам талын блок ертөнцийг судал.<br>Ухаж, барьж, хамтдаа өөрчил.</p>
          <form id="join-form">
            <label for="player-name">Таны нэр</label>
            <div class="name-row">
              <input id="player-name" maxlength="18" autocomplete="nickname" spellcheck="false">
              <button type="submit">ЕРТӨНЦӨД ОРОХ <b>→</b></button>
            </div>
          </form>
          <div class="control-hints">
            <span><kbd>WASD</kbd> ХӨДЛӨХ</span>
            <span><kbd>LEFT CLICK</kbd> УХАХ</span>
            <span><kbd>RIGHT CLICK</kbd> БАРИХ</span>
            <span><kbd>1–6</kbd> БЛОК СОНГОХ</span>
            <span class="phone-hint">УТАСНЫ УДИРДЛАГА БЭЛЭН</span>
          </div>
          <p id="join-status" class="join-status">Ертөнц бэлэн · Singapore edge</p>
        </div>
        <p class="version">CREATIVE WORLD ALPHA</p>
      </section>

      <section id="hud" class="hud hidden" aria-live="polite">
        <div class="top-left">
          <div class="mini-logo">SW</div>
          <div>
            <strong>STEPPE WORLD</strong>
            <span id="connection-status"><i></i> ХОЛБОГДСОН</span>
          </div>
        </div>
        <div id="population" class="population">1 / 96</div>
        <div id="target-block" class="target-block"></div>
        <div id="mining-progress" class="mining-progress"><i></i></div>
        <div class="crosshair"><i></i><i></i></div>
        <div id="announcement" class="announcement hidden"></div>
        <div class="hotbar-wrap">
          <span id="held-block">Өвс</span>
          <div id="hotbar" class="hotbar" aria-label="Блок сонгох"></div>
        </div>
        <div id="latency" class="latency">— MS</div>
      </section>

      <section id="mobile-controls" class="mobile-controls hidden" aria-label="Touch controls">
        <div id="joystick" class="joystick"><i id="joystick-knob"></i></div>
        <button id="mine-button" class="action-button mine-button" aria-label="Ухах">УХАХ</button>
        <button id="place-button" class="action-button place-button" aria-label="Барих">БАРИХ</button>
        <button id="jump-button" class="round-button jump-button" aria-label="Үсрэх">↑</button>
      </section>
    </main>
    <script type="module" src="/client/main.js"></script>
  </body>
</html>
